name: Сообщить об ошибке
description: Что-то работает не так? Помогите разобраться.
title: "[Баг]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему как можно точнее. Не публикуйте пароли, токены, личные данные или другую секретную информацию.
  - type: dropdown
    id: version_type
    attributes:
      label: Где возникла проблема?
      options:
        - Userscript Tampermonkey
        - Расширение Chrome
        - Расширение Brave
        - Расширение Edge
        - Расширение Opera
        - Другое
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Legion7TV
      description: Например, 5.0.0. Если не знаете — укажите «не знаю».
      placeholder: 5.0.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Браузер и его версия
      description: Например, Chrome 130 или Firefox 132.
      placeholder: Chrome 130
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить проблему?
      description: Перечислите действия по порядку.
      placeholder: |
        1. Открыть ...
        2. Нажать ...
        3. Увидеть ошибку
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что должно было произойти?
      placeholder: Опишите ожидаемый результат.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло вместо этого?
      placeholder: Опишите фактический результат и приложите скриншот, если он поможет.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Ошибки из консоли браузера
      description: Необязательно. Откройте DevTools → Console и скопируйте относящиеся к проблеме ошибки.
      render: text
    validations:
      required: false
